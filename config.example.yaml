serial:
  port: /dev/serial0
  baudrate: 115200

wifi:
  enabled: false
  interface: wlan0
  network1Ssid: ""
  network1Password: ""
  network2Ssid: ""
  network2Password: ""
  network3Ssid: ""
  network3Password: ""
  network4Ssid: ""
  network4Password: ""

rtcm:
  mode: ntrip

ntrip:
  host: your.ntrip.caster.host
  port: 2101
  mountpoint: your_mountpoint
  username: your_username
  password: your_password
  maxConsecutiveFailures: 25

tcp:
  host: 192.168.1.50
  port: 9000

logging:
  level: INFO

status:
  enabled: true
  mode: normal
  intervalSec: 0.5

battery:
  enabled: true
  driver: waveshare-ups-hat-c
  i2cBus: 1
  i2cAddress: 0x43
  minVoltageV: 3.0
  maxVoltageV: 4.2

peerUdp:
  enabled: true
  deviceId: rover-01
  port: 5005
  broadcastHost: 255.255.255.255
  # Straight-line antenna-to-edge buffer distance in meters.
  # Each rover advertises its own value, and both values are
  # subtracted from the peer separation before safety margin.
  bufferDistanceM: 0.0
  # Optional extra unicast targets. This is usually where you put
  # ZeroTier peer IP addresses if you want peer updates off-LAN too.
  extraTargets: []

blynk:
  enabled: true
  broker: blynk.cloud
  port: 8883 # 8883 enables TLS for Blynk, 1883 uses plain MQTT
  username: device
  authToken: your_blynk_device_auth_token
  templateId: TMPLxxxxxxx
  firmwareVersion: 0.1.0
  publishIntervalSec: 1.0

mqtt:
  enabled: false
  broker: 192.168.1.50
  port: 1883 # 8883 enables TLS automatically, matching Blynk behavior
  username: ""
  password: ""
  topic: batch_ds
  publishIntervalSec: 0.1

web:
  enabled: false
  host: 0.0.0.0
  port: 8080
  safeDistanceThresholdM: 25.0
