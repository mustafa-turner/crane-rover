serial:
  port: /dev/serial0
  baudrate: 115200

wifi:
  enabled: false
  interface: wlan0
  network1Ssid: ""
  network1Password: ""
  network2Ssid: ""
  network2Password: ""
  network3Ssid: ""
  network3Password: ""
  network4Ssid: ""
  network4Password: ""

ntrip:
  host: your.ntrip.caster.host
  port: 2101
  mountpoint: your_mountpoint
  username: your_username
  password: your_password

logging:
  level: INFO

status:
  enabled: true
  mode: normal

battery:
  enabled: true
  driver: waveshare-ups-hat-c
  i2cBus: 1
  i2cAddress: 0x43
  minVoltageV: 3.0
  maxVoltageV: 4.2

peerUdp:
  enabled: true
  deviceId: rover-01
  port: 5005
  broadcastHost: 255.255.255.255
  # Optional extra unicast targets. This is usually where you put
  # ZeroTier peer IP addresses if you want peer updates off-LAN too.
  extraTargets: []

blynk:
  enabled: true
  broker: blynk.cloud
  port: 8883
  username: device
  authToken: your_blynk_device_auth_token
  templateId: TMPLxxxxxxx
  firmwareVersion: 0.1.0
