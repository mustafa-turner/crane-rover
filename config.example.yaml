serial:
  port: /dev/serial0
  baudrate: 115200

ntrip:
  host: your.ntrip.caster.host
  port: 2101
  mountpoint: your_mountpoint
  username: your_username
  password: your_password
  connectTimeoutSec: 10
  readTimeoutSec: 15
  reconnectDelaySec: 5
  chunkSize: 1024
  ggaForwardEnabled: true
  ggaForwardIntervalSec: 5
  recvPollTimeoutSec: 1.0
  rtcmLogIntervalSec: 10

logging:
  level: INFO

status:
  enabled: true
  printIntervalSec: 2

battery:
  enabled: true
  driver: waveshare-ups-hat-c
  pollIntervalSec: 10
  i2cBus: 1
  i2cAddress: 0x43
  shuntOhms: 0.1
  maxCurrentA: 3.2
  minVoltageV: 3.0
  maxVoltageV: 4.2
  # If you want the old generic Linux power-supply reader instead, use:
  # driver: sysfs
  # basePath: /sys/class/power_supply/battery

peerUdp:
  enabled: true
  deviceId: rover-01
  port: 5005
  broadcastHost: 255.255.255.255
  listenHost: ""
  broadcastIntervalSec: 1.0
  recvPollTimeoutSec: 0.2
  maxPeerMessageAgeSec: 2.0
  accuracyByFixLabel:
    "UNKNOWN": null
    "NO FIX": null
    "GNSS FIX": 5.0
    "DGPS": 1.5
    "RTK FLOAT": 0.5
    "RTK FIXED": 0.02
    "DEAD RECKONING": 10.0

blynk:
  enabled: true
  broker: blynk.cloud
  port: 8883
  username: device
  authToken: your_blynk_device_auth_token
  templateId: TMPLxxxxxxx
  firmwareVersion: 0.1.0
  publishIntervalSec: 2
  useTls: true
  keepaliveSec: 45
