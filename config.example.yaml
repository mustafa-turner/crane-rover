serial:
  port: /dev/serial0
  baudrate: 115200

ntrip:
  host: your.ntrip.caster.host
  port: 2101
  mountpoint: your_mountpoint
  username: your_username
  password: your_password
  connectTimeoutSec: 10
  readTimeoutSec: 15
  reconnectDelaySec: 5
  chunkSize: 1024
  ggaForwardEnabled: true
  ggaForwardIntervalSec: 5
  recvPollTimeoutSec: 1.0
  rtcmLogIntervalSec: 10

logging:
  level: INFO

status:
  printIntervalSec: 2

battery:
  enabled: true
  pollIntervalSec: 10
  # Option 1: set basePath and let the code read common files under it.
  # Example: /sys/class/power_supply/battery
  # basePath: /sys/class/power_supply/battery
  #
  # Option 2: override individual paths if your UPS HAT uses different names.
  # capacityPath: /sys/class/power_supply/battery/capacity
  # voltageNowPath: /sys/class/power_supply/battery/voltage_now
  # statusPath: /sys/class/power_supply/battery/status
  # presentPath: /sys/class/power_supply/battery/present

blynk:
  enabled: true
  broker: blynk.cloud
  port: 8883
  username: device
  authToken: your_blynk_device_auth_token
  templateId: TMPLxxxxxxx
  firmwareVersion: 0.1.0
  publishIntervalSec: 2
  useTls: true
  keepaliveSec: 45
